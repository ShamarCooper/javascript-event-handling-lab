<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Event Handling Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>JavaScript Event Handling Lab 7</h1>
        <p>JavaScript Events.</p>
    </header>

    <main>
 <section>
    <h2>Mouse Events</h2>

    <button id="hoverButton">Hover Over Me</button>

    <p id="mouseMessage">
        Move your mouse over the button.
    </p>
 </section>

 <section>
    <h2>Keyboard Events</h2>

    <label for="keyboardInput">Type something:</label>

    <input
        type="text"
        id="keyboardInput"
        placeholder="Press any keyboard key"
    >

    <p id="keyboardMessage">
        Your last key pressed will appear here.
    </p>
</section>

<section>
    <h2>Form Events</h2>

    <form id="messageForm">
        <label for="nameInput">Enter your name:</label>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
            required
        >

        <button type="submit">Submit Form</button>
    </form>

    <p id="formMessage">
        Your submission message will appear here.
    </p>
</section>

        <section>
            <h2>Focus and Blur Events</h2>
        </section>

        <section>
            <h2>Event Delegation</h2>
        </section>
    </main>

    </footer>

    <script src="script.js"></script>
</body>
</html>
